<header class="entete">
  <h1><a class="retour" href="plus.html" aria-label="Retour">‹</a>Tendance</h1>
  <span class="statut-hors-ligne"></span>
</header>

<div class="page">
  <div class="carte">
    <select class="champ" id="select-categorie" style="margin-bottom:8px">
      <option value="">Toutes les catégories</option>
    </select>
    <div class="periode">
      <label><span class="etiquette-champ">Du</span><input class="champ" id="depuis" type="month"></label>
      <label><span class="etiquette-champ">Au</span><input class="champ" id="jusqua" type="month"></label>
    </div>
  </div>

  <div class="carte">
    <h3 style="margin-top:0">Prévu et dépensé, mois par mois</h3>
    <div style="display:flex; gap:14px; flex-wrap:wrap; font-size:0.78rem; color:var(--texte); margin-bottom:6px">
      <span><span style="color:var(--texte-att)">■</span> Prévu</span>
      <span><span style="color:var(--accent)">■</span> Dépensé</span>
      <span><span style="color:var(--rouge)">■</span> Dépensé, au-delà du prévu</span>
    </div>
    <div id="graphique-barres"></div>
  </div>

  <div class="carte">
    <h3 style="margin-top:0">Argent reporté d’un mois sur l’autre</h3>
    <div id="graphique-ligne"></div>
  </div>
</div>
