<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget — Épargne</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0b0c">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<header class="entete">
  <h1><a class="retour" href="plus.html" aria-label="Retour">‹</a>Épargne</h1>
  <span class="statut-hors-ligne"></span>
</header>

<div class="page">
  <div id="liste-objectifs"></div>

  <div class="carte">
    <h3 style="margin-top:0">Nouvel objectif</h3>
    <input class="champ" id="obj-nom" placeholder="Nom (ex : Voyage, Fonds d’urgence)">
    <input class="champ" id="obj-cible" placeholder="Montant cible" inputmode="numeric">
    <button class="bouton-secondaire" id="obj-ajouter" style="margin-top:0">Ajouter l’objectif</button>
  </div>

  <div class="carte">
    <h3 style="margin-top:0">Versement / retrait</h3>
    <select class="champ" id="mvt-objectif">
      <option value="">Épargne générale (sans objectif)</option>
    </select>
    <select class="champ" id="mvt-type">
      <option value="versement">Versement</option>
      <option value="retrait">Retrait</option>
    </select>
    <input class="champ" id="mvt-montant" placeholder="Montant" inputmode="numeric">
    <button class="bouton-principal" id="mvt-enregistrer">Enregistrer</button>
  </div>
</div>
