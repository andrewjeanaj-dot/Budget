<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget — Mois</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0b0c">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">

<header class="entete">
  <h1>Budget du mois</h1>
  <span class="statut-hors-ligne"></span>
</header>

<div class="page">
  <div class="selecteur-mois">
    <button id="mois-prec" aria-label="Mois précédent">‹</button>
    <span class="libelle-mois" id="libelle-mois"></span>
    <button id="mois-suiv" aria-label="Mois suivant">›</button>
  </div>

  <div class="carte carte-principale" id="carte-principale">
    <div class="etiquette" id="h-etiquette">Il te reste à dépenser ce mois-ci</div>
    <div class="grand-chiffre" id="h-reste">—</div>
    <div class="barre-progression"><div id="h-barre"></div></div>
    <div class="sous-texte" id="h-detail"></div>
    <div class="report" id="h-report"></div>
  </div>

  <details class="carte detail-mois">
    <summary>Le détail du mois</summary>
    <div class="bandeau-bilan">
      <div class="item"><div class="label">Report du mois dernier</div><div class="valeur" id="v-solde-depart">—</div></div>
      <div class="item"><div class="label">Argent du mois (report + revenus)</div><div class="valeur" id="v-dispo">—</div></div>
      <div class="item"><div class="label">Pas encore prévu dans une catégorie</div><div class="valeur" id="v-reste">—</div></div>
      <div class="item"><div class="label">Reporté au mois prochain</div><div class="valeur" id="v-solde-report">—</div></div>
    </div>
    <button class="lien-discret" id="bouton-solde-depart" type="button">✎ Corriger le report du mois dernier</button>
  </details>

  <div class="carte">
    <h3 style="margin-top:0">Revenus — <span id="v-total-revenus">0 F</span></h3>
    <div id="liste-revenus"></div>
    <div style="display:flex; gap:8px; margin-top:8px">
      <input class="champ" id="revenu-libelle" placeholder="Libellé" style="margin-bottom:0">
      <input class="champ" id="revenu-montant" placeholder="Montant" inputmode="numeric" style="margin-bottom:0; max-width:110px">
      <button class="icone-action" id="revenu-ajouter" style="font-size:1.4rem">＋</button>
    </div>
  </div>

  <div id="groupes-budget"></div>

  <button class="bouton-secondaire" id="bouton-generer">Générer le mois suivant →</button>
</div>

<script src="js/format.js"></script>
<script src="js/db.js"></script>
<script src="js/local.js"></script>
<script src="js/donnees.js"></script>
<script src="js/nav.js"></script>
<script src="js/budget.js"></script>
